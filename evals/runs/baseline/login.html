<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
:root { --ink:#0f172a; --muted:#64748b; --line:#cbd5e1; --brand:#4f46e5; --brand-d:#4338ca; --bg:#f1f5f9; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(160deg,#eef2ff,var(--bg)); color:var(--ink); }
.box { width:100%; max-width:400px; background:#fff; padding:40px 32px; border-radius:16px;
  box-shadow:0 1px 3px rgba(15,23,42,.08), 0 20px 40px -12px rgba(15,23,42,.15); }
h1 { margin:0 0 4px; font-size:24px; font-weight:700; letter-spacing:-.02em; }
.sub { margin:0 0 28px; color:var(--muted); font-size:14px; }
label { display:block; margin-bottom:6px; font-size:13px; font-weight:600; }
input { width:100%; padding:11px 12px; margin-bottom:18px; font:inherit; font-size:15px;
  border:1px solid var(--line); border-radius:8px; transition:border-color .15s, box-shadow .15s; }
input:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(79,70,229,.2); }
button { width:100%; padding:12px; font:inherit; font-weight:600; color:#fff; background:var(--brand);
  border:none; border-radius:8px; cursor:pointer; transition:background .15s; }
button:hover { background:var(--brand-d); }
button:focus-visible { outline:3px solid rgba(79,70,229,.4); outline-offset:2px; }
.forgot { display:block; margin-top:20px; text-align:center; font-size:14px; color:var(--brand); text-decoration:none; }
.forgot:hover { text-decoration:underline; }
</style>
</head>
<body>
<form class="box" onsubmit="event.preventDefault(); login()">
<h1>Welcome back</h1>
<p class="sub">Sign in to your account</p>
<label for="email">Email</label>
<input id="email" type="email" placeholder="you@company.com" autocomplete="email" required>
<label for="pw">Password</label>
<input id="pw" type="password" placeholder="Enter your password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
<a class="forgot" href="/forgot">Forgot password?</a>
</form>
</body>
</html>
