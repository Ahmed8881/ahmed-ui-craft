<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/*
 * ahmed-ui-craft starter tokens
 * Default direction: warm editorial-technical (paper neutrals, ink text, one vermilion accent).
 * Change the VALUES to match your direction. Keep the NAMES so components stay portable.
 * Components use only block 2 and 3 tokens; block 1 is the raw palette and scales.
 */

/* ---------- 1. Raw palette and scales (never used directly in components) ---------- */
:root {
  /* Neutrals tinted toward the accent hue (hue 60) instead of pure gray */
  --paper-50: oklch(98.5% 0.006 85);
  --paper-100: oklch(96% 0.01 85);
  --paper-200: oklch(91% 0.012 80);
  --paper-300: oklch(84% 0.014 75);
  --ink-500: oklch(55% 0.015 60);
  --ink-600: oklch(46% 0.016 60);
  --ink-700: oklch(37% 0.016 60);
  --ink-800: oklch(27% 0.014 60);
  --ink-900: oklch(20% 0.012 60);
  --ink-950: oklch(15% 0.01 60);

  /* One sharp accent */
  --vermilion-400: oklch(70% 0.17 38);
  --vermilion-500: oklch(62% 0.2 35);
  --vermilion-600: oklch(54% 0.19 33);
  --vermilion-700: oklch(46% 0.16 32);

  /* Status hues */
  --green-600: oklch(52% 0.13 150);
  --green-400: oklch(74% 0.15 150);
  --amber-700: oklch(52% 0.12 70);
  --amber-400: oklch(82% 0.15 80);
  --red-600: oklch(52% 0.2 27);
  --red-400: oklch(72% 0.16 25);

  /* Spacing: 4px base. Use these for padding, gap, margin. */
  --space-0: 0;
  --space-1: 0.25rem; /* 4 */
  --space-2: 0.5rem; /* 8 */
  --space-3: 0.75rem; /* 12 */
  --space-4: 1rem; /* 16 */
  --space-5: 1.5rem; /* 24 */
  --space-6: 2rem; /* 32 */
  --space-7: 3rem; /* 48 */
  --space-8: 4rem; /* 64 */
  --space-9: 6rem; /* 96 */
  --space-10: 8rem; /* 128 */
  --space-section: clamp(var(--space-7), 8vw, var(--space-10));

  /* Layout */
  --container-max: 72rem;
  --container-narrow: 42rem;
  --gutter: clamp(var(--space-4), 4vw, var(--space-6));
  --measure: 68ch;
  --tap-min: 2.75rem; /* 44px touch target */

  /* Motion durations */
  --dur-instant: 80ms;
  --dur-fast: 150ms;
  --dur-base: 220ms;
  --dur-slow: 360ms;

  /* Stacking */
  --z-base: 0;
  --z-sticky: 100;
  --z-dropdown: 200;
  --z-overlay: 300;
  --z-modal: 400;
  --z-toast: 500;
}

/* ---------- 2. Theme tokens (light). Tailwind v4: change `:root` to `@theme` ---------- */
:root {
  /* Surfaces and text */
  --color-bg: var(--paper-50);
  --color-surface: var(--paper-100);
  --color-surface-raised: oklch(100% 0 0);
  --color-text: var(--ink-900); /* 17.4:1 on bg */
  --color-text-muted: var(--ink-600); /* 6.9:1 on bg, 6.4:1 on surface */
  --color-border: var(--paper-300);
  --color-border-strong: var(--ink-500); /* 4.7:1, input borders need 3:1 */

  /* Accent: reserve for primary actions and key data */
  --color-accent: var(--vermilion-600); /* 5.5:1 with white text */
  --color-accent-hover: var(--vermilion-700);
  --color-on-accent: oklch(100% 0 0);
  --color-accent-text: var(--vermilion-700); /* 7.4:1, accent used as text on bg */

  /* Status */
  --color-success: var(--green-600);
  --color-warning: var(--amber-700);
  --color-danger: var(--red-600);
  --color-focus: var(--vermilion-600);

  /* Type: display + body + mono. Load these fonts; see references/typography.md */
  --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", monospace;

  /* Type scale: ratio ~1.25 at small screens, ~1.333 at large; fluid between 360px and 1280px */
  --text-xs: 0.8125rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: clamp(1.125rem, 1.08rem + 0.2vw, 1.25rem);
  --text-xl: clamp(1.25rem, 1.15rem + 0.45vw, 1.5rem);
  --text-2xl: clamp(1.5rem, 1.3rem + 0.9vw, 2rem);
  --text-3xl: clamp(1.875rem, 1.5rem + 1.7vw, 2.875rem);
  --text-4xl: clamp(2.25rem, 1.6rem + 3vw, 4rem);
  --text-display: clamp(2.75rem, 1.5rem + 5.6vw, 6rem);

  --leading-tight: 1.05;
  --leading-snug: 1.25;
  --leading-body: 1.6;
  --tracking-tight: -0.02em;
  --tracking-caps: 0.08em;

  /* Radius: small and consistent; containers may be larger than controls */
  --radius-none: 0;
  --radius-sm: 0.25rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-full: 9999px;

  /* Shadow: tinted, layered, used sparingly */
  --shadow-sm: 0 1px 2px oklch(20% 0.02 60 / 0.08);
  --shadow-md: 0 1px 2px oklch(20% 0.02 60 / 0.06), 0 4px 12px oklch(20% 0.02 60 / 0.08);
  --shadow-lg: 0 2px 4px oklch(20% 0.02 60 / 0.06), 0 12px 32px oklch(20% 0.02 60 / 0.12);

  /* Easing */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ---------- 3. Dark theme: redefine semantic tokens only ---------- */
:root[data-theme="dark"] {
  color-scheme: dark;
  --color-bg: var(--ink-950);
  --color-surface: var(--ink-900);
  --color-surface-raised: var(--ink-800);
  --color-text: var(--paper-100);
  --color-text-muted: var(--paper-300);
  --color-border: var(--ink-700);
  --color-border-strong: var(--ink-500);
  --color-accent: var(--vermilion-400);
  --color-accent-hover: var(--vermilion-500);
  --color-on-accent: var(--ink-950);
  --color-accent-text: var(--vermilion-400);
  --color-success: var(--green-400);
  --color-warning: var(--amber-400);
  --color-danger: var(--red-400);
  --color-focus: var(--vermilion-400);
  --shadow-md: 0 1px 2px oklch(0% 0 0 / 0.4), 0 4px 12px oklch(0% 0 0 / 0.4);
  --shadow-lg: 0 2px 4px oklch(0% 0 0 / 0.4), 0 12px 32px oklch(0% 0 0 / 0.5);
}

/* Follow the OS unless the user picked a theme explicitly */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --color-bg: var(--ink-950);
    --color-surface: var(--ink-900);
    --color-surface-raised: var(--ink-800);
    --color-text: var(--paper-100);
    --color-text-muted: var(--paper-300);
    --color-border: var(--ink-700);
    --color-border-strong: var(--ink-500);
    --color-accent: var(--vermilion-400);
    --color-accent-hover: var(--vermilion-500);
    --color-on-accent: var(--ink-950);
    --color-accent-text: var(--vermilion-400);
    --color-success: var(--green-400);
    --color-warning: var(--amber-400);
    --color-danger: var(--red-400);
    --color-focus: var(--vermilion-400);
  }
}

/* Motion off for users who ask for it */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 0ms;
    --dur-base: 0ms;
    --dur-slow: 0ms;
  }
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---------- 4. Minimal base that every project needs ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading-body);
  overflow-wrap: break-word;
}
h1,
h2,
h3 {
  font-family: var(--font-display);
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-tight);
  text-wrap: balance;
}
p {
  text-wrap: pretty;
}
img,
svg,
video {
  display: block;
  max-width: 100%;
  height: auto;
}
:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

/* ---------- Component styles (semantic tokens only) ---------- */
main { min-height: 100svh; display: grid; place-items: center; padding: var(--gutter); }
.card { width: min(100%, 26rem); background: var(--color-surface-raised); border: 1px solid var(--color-border); border-top: 3px solid var(--color-accent); border-radius: var(--radius-sm); padding: var(--space-6) var(--space-5); box-shadow: var(--shadow-md); }
.index { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--color-text-muted); margin: 0 0 var(--space-4); padding-bottom: var(--space-3); border-bottom: 1px solid var(--color-border); }
h1 { font-weight: 500; font-style: italic; font-size: var(--text-3xl); margin: 0 0 var(--space-2); }
.lede { color: var(--color-text-muted); margin: 0 0 var(--space-5); }
.field { margin-bottom: var(--space-4); }
label { display: block; font-weight: 600; font-size: var(--text-sm); margin-bottom: var(--space-1); }
input { width: 100%; min-height: var(--tap-min); padding: var(--space-2) var(--space-3); font: inherit; color: var(--color-text); background: var(--color-bg); border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm); transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
input::placeholder { color: var(--color-text-muted); }
input:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; border-color: var(--color-focus); }
input[aria-invalid="true"] { border-color: var(--color-danger); }
input:disabled { opacity: 0.6; cursor: not-allowed; }
.error { color: var(--color-danger); font-size: var(--text-sm); margin: var(--space-1) 0 0; min-height: 1.4em; }
.error:empty { display: none; }
button { position: relative; width: 100%; min-height: var(--tap-min); font: inherit; font-weight: 600; color: var(--color-on-accent); background: var(--color-accent); border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out), transform var(--dur-instant) var(--ease-out); }
button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
button:active { transform: translateY(1px); }
button:disabled { opacity: 0.6; cursor: not-allowed; }
@media (hover: hover) { button:not(:disabled):hover { background: var(--color-accent-hover); } a:hover { text-decoration-thickness: 2px; } }
.spinner { display: none; width: 1.1em; height: 1.1em; border: 2px solid var(--color-on-accent); border-right-color: transparent; border-radius: var(--radius-full); animation: spin 700ms linear infinite; }
button[aria-busy="true"] { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); }
button[aria-busy="true"] .spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.foot { margin: var(--space-5) 0 0; text-align: center; font-size: var(--text-sm); }
a { color: var(--color-accent-text); text-underline-offset: 0.2em; display: inline-block; padding: var(--space-3) var(--space-2); }
</style>
</head>
<body>
<main>
  <form class="card" id="f" novalidate aria-labelledby="t">
    <p class="index">01 / Account access</p>
    <h1 id="t">Sign in</h1>
    <p class="lede">Welcome back. Enter your work email to continue.</p>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required aria-describedby="email-err">
      <p class="error" id="email-err"></p>
    </div>
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Your password" required aria-describedby="pw-err">
      <p class="error" id="pw-err"></p>
    </div>
    <button type="submit" id="go"><span class="spinner" aria-hidden="true"></span><span id="lbl">Sign in</span></button>
    <p class="foot"><a href="/forgot">Forgot password?</a></p>
  </form>
</main>
<script>
const f = document.getElementById('f'), go = document.getElementById('go'), lbl = document.getElementById('lbl');
const bad = (el, msg) => { el.setAttribute('aria-invalid', 'true'); document.getElementById(el.id + '-err').textContent = msg; };
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const em = f.email, pw = f.password;
  for (const el of [em, pw]) { el.removeAttribute('aria-invalid'); document.getElementById(el.id + '-err').textContent = ''; }
  if (!em.validity.valid) bad(em, em.value ? 'Enter a valid email address.' : 'Email is required.');
  if (!pw.value) bad(pw, 'Password is required.');
  const first = f.querySelector('[aria-invalid="true"]');
  if (first) return first.focus();
  go.disabled = true; go.setAttribute('aria-busy', 'true'); lbl.textContent = 'Signing in';
  try { if (typeof login === 'function') await login(); } finally { go.disabled = false; go.removeAttribute('aria-busy'); lbl.textContent = 'Sign in'; }
});
</script>
</body>
</html>
