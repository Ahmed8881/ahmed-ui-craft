name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Skill structure and manifests
        run: node .github/lint-skill.mjs

      - name: Script self-tests
        working-directory: skills/ahmed-ui-craft
        run: |
          node scripts/contrast.mjs --test
          node scripts/check-tokens.mjs --test
          node scripts/palette.mjs --test

      - name: Starter tokens and presets pass WCAG AA in light and dark
        working-directory: skills/ahmed-ui-craft
        run: node scripts/check-tokens.mjs assets/tokens.css assets/directions/*.css

      - name: Audit passes on the skill's own assets
        run: bash skills/ahmed-ui-craft/scripts/audit.sh skills/ahmed-ui-craft/assets

      - name: Audit still catches known-bad output
        run: |
          if bash skills/ahmed-ui-craft/scripts/audit.sh evals/runs/baseline/login.html; then
            echo "audit.sh passed a page it must flag"; exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Playwright and axe-core
        run: |
          npm i --no-save playwright@1.65.0 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Preset preview renders cleanly
        run: node skills/ahmed-ui-craft/scripts/browser-check.mjs skills/ahmed-ui-craft/assets/directions/preview.html --out ui-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots
          path: ui-check/
